<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spreadsheets</title>
  <!-- Vite builds src/main.ts (TypeScript + SheetJS) into a single file in dist/assets. -->
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header id="bar">
    <div id="file"></div>
    <button type="button" id="open" class="edit"></button>
    <button type="button" id="new" class="edit"></button>
    <span id="status"></span>
  </header>
  <div id="formulaBar">
    <span id="address"></span>
    <input id="formula" autocomplete="off" spellcheck="false">
  </div>
  <main id="view">
    <!-- The grid (grid.ts) replaces everything inside #sheet: the "no files" notice goes outside it. -->
    <div id="sheet"></div>
    <div id="empty"></div>
  </main>
  <footer id="tabs"></footer>
</body>
</html>
