<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hojas de cálculo</title>
  <!-- Vite compila src/main.ts (TypeScript + SheetJS) en un único archivo en dist/assets. -->
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header id="bar">
    <div id="file"></div>
    <button type="button" id="open" class="edit"></button>
    <button type="button" id="new" class="edit"></button>
    <span id="status"></span>
  </header>
  <div id="formulaBar">
    <span id="address"></span>
    <input id="formula" autocomplete="off" spellcheck="false">
  </div>
  <main id="view">
    <!-- La grilla (grid.ts) reemplaza todo lo de adentro de #sheet: el aviso de "sin archivos" va aparte. -->
    <div id="sheet"></div>
    <div id="empty"></div>
  </main>
  <footer id="tabs"></footer>
</body>
</html>
