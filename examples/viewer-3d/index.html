<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Viewer</title>
  <!-- Vite builds src/main.ts (TypeScript + three.js, only what is used) into a single file in dist/assets. -->
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header id="bar">
    <div id="model"></div>
    <button type="button" id="open" class="edit"></button>
    <div id="color" class="opt"></div>
    <label class="opt"><input type="checkbox" id="wire"> <span id="wireLabel"></span></label>
    <label class="opt"><input type="checkbox" id="spin"> <span id="spinLabel"></span></label>
    <button type="button" id="reset"></button>
    <button type="button" id="saveView" class="edit"></button>
    <span id="status"></span>
  </header>
  <main id="view">
    <div id="empty"></div>
  </main>
</body>
</html>
