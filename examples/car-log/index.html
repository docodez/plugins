<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car log</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header id="car"></header>
  <div id="viewNote" hidden></div>
  <nav id="tabs"></nav>
  <main id="page"></main>
  <div id="sheet" hidden><div id="sheetBox"></div></div>
  <div id="viewer" hidden>
    <img id="viewerImg" alt="">
    <div id="viewerBar">
      <button type="button" id="viewerPrev" class="tool">‹</button>
      <span id="viewerInfo"></span>
      <button type="button" id="viewerNext" class="tool">›</button>
      <button type="button" id="viewerClose" class="tool">✕</button>
    </div>
  </div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
</body>
</html>
