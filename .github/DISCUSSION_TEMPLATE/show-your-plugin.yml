title: "[Plugin] "
labels: [showcase]
body:
  - type: markdown
    attributes:
      value: |
        Share a plugin you made. Screenshots help a lot (a phone one too!).
  - type: input
    id: name
    attributes:
      label: Plugin name and id
      placeholder: "Recipe Box (yourname.recipes)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source code
      placeholder: "https://github.com/you/recipes"
  - type: input
    id: download
    attributes:
      label: Download (.dczp)
  - type: input
    id: license
    attributes:
      label: License
      placeholder: "MIT"
